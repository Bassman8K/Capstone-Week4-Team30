packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.5'
  # js-yaml (GHSA-2883-xcg3-v3hh, high) — reaches us transitively through
  # eslint's config loader. Force the patched line.
  js-yaml: '^4.3.2'
  # nanoid (GHSA-2v37-7h3g-55p8, high) — force the patched version everywhere.
  nanoid: '^3.3.18'
  # brace-expansion (GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, high) — DoS via
  # uncontrolled recursion in parseCommaParts. Only reaches us through dev
  # tooling (eslint, typescript-eslint, vitest coverage) via minimatch, so
  # nothing we ship is affected — but it fails `pnpm audit --audit-level=high`
  # in CI. Three majors are in the tree, so pin each patched line.
  'brace-expansion@1': '^1.1.20'
  'brace-expansion@2': '^2.1.6'
  'brace-expansion@5': '^5.0.11'
  # October 2026 advisories - patched lines within the same major.
  proxy-addr: '^2.0.8'
  '@grpc/grpc-js': '^1.14.5'
  '@fastify/busboy': '^3.2.1'
  source-map-js: '^1.2.2'
  # tinypool is dev-only via vitest; no 1.x fix exists, so use 2.x.
  tinypool: '^2.1.2'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    # braces: no fixed release exists yet (3.0.3 is latest). Dev-only via
    # eslint-config-next. Remove this once braces 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm
